name: Build, test, and update Jira

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Backend and frontend verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests and package
        run: mvn -B verify

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  jira-done:
    name: Mark associated Jira issue done
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success'
    steps:
      - name: Extract issue key
        id: issue
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          KEY="$(printf '%s\n%s\n' "$BRANCH_NAME" "$COMMIT_MESSAGE" | grep -Eo '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1 || true)"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Transition issue to Done
        if: steps.issue.outputs.key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.issue.outputs.key }}
        run: |
          if [ -z "${JIRA_BASE_URL:-}" ] || [ -z "${JIRA_EMAIL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ]; then
            echo "::error::Jira secrets are missing. Add JIRA_BASE_URL, JIRA_EMAIL, and JIRA_API_TOKEN in repository Actions secrets."
            exit 1
          fi

          JIRA_URL="${JIRA_BASE_URL%/}"
          ISSUE_URL="$JIRA_URL/rest/api/3/issue/$ISSUE_KEY"
          AUTH=(-u "$JIRA_EMAIL:$JIRA_API_TOKEN")

          ISSUE_JSON="$(curl --fail --silent --show-error "${AUTH[@]}" "$ISSUE_URL?fields=status")"
          CURRENT_STATUS="$(printf '%s' "$ISSUE_JSON" | jq -r '.fields.status.name // empty')"
          NORMALIZED_STATUS="$(printf '%s' "$CURRENT_STATUS" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"

          if [ "$NORMALIZED_STATUS" = "done" ]; then
            echo "$ISSUE_KEY is already Done; no transition is needed."
            exit 0
          fi

          if [ "$NORMALIZED_STATUS" != "todo" ]; then
            echo "::error::$ISSUE_KEY is in '$CURRENT_STATUS', not To Do/Todo. No Jira status was changed."
            exit 1
          fi

          TRANSITIONS="$(curl --fail --silent --show-error --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            "$ISSUE_URL/transitions")"
          TRANSITION_ID="$(printf '%s' "$TRANSITIONS" | jq -r '.transitions[] | select((.name | ascii_downcase) == "done") | .id' | head -n 1)"
          if [ -z "$TRANSITION_ID" ]; then
            echo "::error::No Done transition is available from the current status for $ISSUE_KEY."
            exit 1
          fi

          curl --fail --silent --show-error --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Content-Type: application/json" \
            --request POST \
            --data "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}" \
            "$ISSUE_URL/transitions"

          for _ in 1 2 3 4 5; do
            UPDATED_JSON="$(curl --fail --silent --show-error "${AUTH[@]}" "$ISSUE_URL?fields=status")"
            UPDATED_STATUS="$(printf '%s' "$UPDATED_JSON" | jq -r '.fields.status.name // empty')"
            UPDATED_NORMALIZED="$(printf '%s' "$UPDATED_STATUS" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            if [ "$UPDATED_NORMALIZED" = "done" ]; then
              echo "$ISSUE_KEY transitioned from '$CURRENT_STATUS' to '$UPDATED_STATUS'."
              exit 0
            fi
            sleep 2
          done

          echo "::error::$ISSUE_KEY transition was submitted but its status is '$UPDATED_STATUS', not Done."
          exit 1

      - name: Skip Jira update when issue key or credentials are absent
        if: steps.issue.outputs.key == ''
        run: echo "No Jira issue key found in the pushed branch or commit; leaving Jira unchanged."
